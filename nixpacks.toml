[phases.setup]
nixPkgs = ["nodejs_20"]

[phases.install]
# Railway sets production mode during the image build, but the frontend
# build needs packages listed in devDependencies as well.
cmds = ["NPM_CONFIG_PRODUCTION=false npm ci --include=dev"]

[phases.build]
cmds = ["npm run build"]

[start]
cmd = "npm run start"
